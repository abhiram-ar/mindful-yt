name: release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds
# mindful-yt for every OS and publishes a GitHub release with the archives and
# checksums.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
